<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | RewardZone</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="bg-black min-h-screen text-zinc-100 flex flex-col justify-between antialiased selection:bg-white selection:text-black">

  <!-- Header -->
  <header class="border-b border-zinc-900 bg-black/60 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-white flex items-center justify-center text-black font-black text-sm tracking-tighter">
          RZ
        </div>
        <span class="text-base font-bold tracking-tight text-white">REWARDZONE</span>
      </a>
      <a href="/login" class="text-xs text-zinc-400 hover:text-white transition-colors">
        Already have an account? Sign In &rarr;
      </a>
    </div>
  </header>

  <!-- Register Form Container -->
  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm mono-card p-6 sm:p-8">
      
      <div class="mb-6">
        <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-zinc-900 border border-zinc-800 text-[11px] font-mono text-zinc-400 mb-2">
          <span>+100 Coins Welcome Bonus</span>
        </div>
        <h1 class="text-2xl font-bold text-white tracking-tight">Create your account</h1>
        <p class="text-xs text-zinc-400 mt-1">Start watching streams and earning crypto today</p>
      </div>

      <!-- Referral Badge (if ?ref=CODE present) -->
      <div id="referral-notice-box" class="hidden mb-4 p-2.5 rounded-lg bg-zinc-900 border border-zinc-800 text-xs text-zinc-300 flex items-center justify-between">
        <span class="text-zinc-400">Invited by:</span>
        <span id="referral-notice-code" class="font-mono font-semibold text-white">------</span>
      </div>

      <div id="register-error-alert" class="hidden mb-4 p-3 rounded-lg bg-red-950/40 border border-red-900/60 text-xs text-red-300">
        <!-- Error text -->
      </div>

      <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-zinc-300 mb-1.5" for="reg-username">
            Username
          </label>
          <input 
            type="text" 
            id="reg-username" 
            required 
            minlength="3" 
            maxlength="20"
            placeholder="e.g. Satoshi99"
            class="w-full px-3.5 py-2.5 rounded-lg bg-zinc-900 border border-zinc-800 text-white text-sm focus:outline-none focus:border-zinc-500 transition-colors"
          >
        </div>

        <div>
          <label class="block text-xs font-semibold text-zinc-300 mb-1.5" for="reg-email">
            Email Address
          </label>
          <input 
            type="email" 
            id="reg-email" 
            required 
            placeholder="you@domain.com"
            class="w-full px-3.5 py-2.5 rounded-lg bg-zinc-900 border border-zinc-800 text-white text-sm focus:outline-none focus:border-zinc-500 transition-colors"
          >
        </div>

        <div>
          <label class="block text-xs font-semibold text-zinc-300 mb-1.5" for="reg-phone">
            Country & Phone Number
          </label>
          <div class="flex gap-2">
            <select 
              id="reg-country-code" 
              class="w-32 px-2.5 py-2.5 rounded-lg bg-zinc-900 border border-zinc-800 text-white text-xs font-mono focus:outline-none focus:border-zinc-500 transition-colors"
            >
              <option value="+263">🇿🇼 +263 (ZW)</option>
              <option value="+1" selected>🇺🇸 +1 (US)</option>
              <option value="+44">🇬🇧 +44 (UK)</option>
              <option value="+27">🇿🇦 +27 (ZA)</option>
              <option value="+234">🇳🇬 +234 (NG)</option>
              <option value="+254">🇰🇪 +254 (KE)</option>
              <option value="+233">🇬🇭 +233 (GH)</option>
              <option value="+91">🇮🇳 +91 (IN)</option>
              <option value="+61">🇦🇺 +61 (AU)</option>
              <option value="+49">🇩🇪 +49 (DE)</option>
              <option value="+33">🇫🇷 +33 (FR)</option>
              <option value="+971">🇦🇪 +971 (AE)</option>
              <option value="+63">🇵🇭 +63 (PH)</option>
              <option value="+55">🇧🇷 +55 (BR)</option>
              <option value="+86">🇨🇳 +86 (CN)</option>
            </select>
            <input 
              type="tel" 
              id="reg-phone" 
              placeholder="e.g. 771234567"
              class="flex-1 px-3.5 py-2.5 rounded-lg bg-zinc-900 border border-zinc-800 text-white text-sm focus:outline-none focus:border-zinc-500 transition-colors"
            >
          </div>
          <p class="text-[11px] text-zinc-500 mt-1">Used for EcoCash regional cashouts and account security.</p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-zinc-300 mb-1.5" for="reg-password">
            Password
          </label>
          <input 
            type="password" 
            id="reg-password" 
            required 
            minlength="6"
            placeholder="At least 6 characters"
            class="w-full px-3.5 py-2.5 rounded-lg bg-zinc-900 border border-zinc-800 text-white text-sm focus:outline-none focus:border-zinc-500 transition-colors"
          >
        </div>

        <div>
          <label class="block text-xs font-semibold text-zinc-300 mb-1.5" for="reg-refcode">
            Referral Code (Optional)
          </label>
          <input 
            type="text" 
            id="reg-refcode" 
            placeholder="e.g. DEMO99"
            class="w-full px-3.5 py-2.5 rounded-lg bg-zinc-900 border border-zinc-800 font-mono text-white text-sm focus:outline-none focus:border-zinc-500 transition-colors uppercase"
          >
        </div>

        <button type="submit" id="reg-submit-btn" class="w-full btn-primary py-2.5 mt-2">
          Create Account & Claim +100 Coins
        </button>
      </form>

      <div class="mt-6 pt-5 border-t border-zinc-900 text-center text-xs text-zinc-500">
        Already registered? 
        <a href="/login" class="text-white hover:underline font-semibold ml-1">Sign In</a>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-zinc-900 py-4 text-center text-xs text-zinc-600">
    &copy; 2026 RewardZone. All rights reserved.
  </footer>

  <script src="/js/common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Check for stored or query param referral code
      const params = new URLSearchParams(window.location.search);
      const ref = params.get('ref') || localStorage.getItem('rewardzone_ref');
      if (ref && ref.trim()) {
        const cleanRef = ref.trim().toUpperCase();
        document.getElementById('reg-refcode').value = cleanRef;
        document.getElementById('referral-notice-code').textContent = cleanRef;
        document.getElementById('referral-notice-box').classList.remove('hidden');
      }
    });

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const countryCode = document.getElementById('reg-country-code').value;
      const phoneNumber = document.getElementById('reg-phone').value.trim();
      const password = document.getElementById('reg-password').value;
      const refCode = document.getElementById('reg-refcode').value.trim();
      const errorBox = document.getElementById('register-error-alert');
      const submitBtn = document.getElementById('reg-submit-btn');

      errorBox.classList.add('hidden');

      // Client-side strict email check
      const emailRegex = /^[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?(?:\.[a-zA-Z0-9](?:[a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?)+$/;
      if (!emailRegex.test(email)) {
        errorBox.textContent = 'Please provide a valid email address.';
        errorBox.classList.remove('hidden');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username,
            email,
            password,
            ref_code: refCode,
            country_code: countryCode,
            phone_number: phoneNumber
          })
        });

        const data = await res.json();
        if (!res.ok) {
          errorBox.textContent = data.error || 'Registration failed.';
          errorBox.classList.remove('hidden');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account & Claim +100 Coins';
          return;
        }

        // Store JWT token
        localStorage.setItem('rewardzone_token', data.token);
        window.location.href = '/watch';
      } catch (err) {
        errorBox.textContent = 'Connection error. Please try again.';
        errorBox.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account & Claim +100 Coins';
      }
    }
  </script>
</body>
</html>
